name: Oracle ARM-Server anlegen

on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:

concurrency:
  group: arm-server
  cancel-in-progress: false

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  versuch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - id: lauf
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          # Bis zu ca. 5,5 Stunden lang jede Minute versuchen
          for i in $(seq 1 320); do
            : > erg.txt
            GITHUB_OUTPUT=erg.txt python anlegen.py || true
            e=$(sed -n 's/^ergebnis=//p' erg.txt)
            echo "$(date -u +%H:%M) Versuch $i: $e"
            if [ "$e" = "erfolg" ] || [ "$e" = "vorhanden" ]; then
              echo "ergebnis=$e" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 60
          done
          echo "ergebnis=kein-platz" >> "$GITHUB_OUTPUT"
      - if: steps.lauf.outputs.ergebnis == 'erfolg' || steps.lauf.outputs.ergebnis == 'vorhanden'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Oracle-Server ist da!" \
            --body "server-1 (2 Kerne, 12 GB, Ubuntu 24.04) wurde in deinem Oracle-Konto angelegt. Sag Claude Bescheid, dann wird er eingerichtet." \
            --assignee "$GITHUB_REPOSITORY_OWNER"
          gh workflow disable "Oracle ARM-Server anlegen" --repo "$GITHUB_REPOSITORY"
